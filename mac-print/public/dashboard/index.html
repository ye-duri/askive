<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연세스튜디오 · 인쇄관리</title><link rel="stylesheet" href="admin.css"><script type="module" src="admin.js"></script></head><body class="login-mode"><main><header><span class="brand">YONSEI STUDIO</span><h1>사진 인쇄 관리</h1></header><section id="login-panel" class="login"><div class="login-mascot" aria-hidden="true"><span class="sheep"></span><span class="sparkle one">✦</span><span class="sparkle two">✧</span></div><h2>운영자 로그인</h2><form id="login-form"><label for="password">비밀번호 입력</label><input id="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required><button class="primary" id="login-button">로그인</button></form></section><section id="dashboard" hidden><div class="toolbar"><div><strong id="queue-count">사진 확인 중…</strong><span id="updated"></span></div><div class="actions"><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div></div><div class="guide printer-panel"><div class="settings"><label>프린터 <select id="printer" aria-label="프린터"><option value="">연결 확인 중…</option></select></label><label>인쇄 배율 <input id="scale" type="number" min="85" max="100" value="94">%</label><button id="helper-reconnect">프린터 다시 연결</button></div><p id="helper-status" role="status">이 노트북의 인쇄 도우미를 확인하고 있습니다.</p><p>CP1500을 USB로 연결하고 인쇄 도우미를 실행해 주세요. <a href="https://askive.pages.dev/print/yonsei-print-helper-mac.zip" download>처음 한 번 실행할 도우미 다운로드</a><span id="helper-fallback" hidden> · <a href="http://127.0.0.1:4178/dashboard/" target="_blank" rel="noopener">이 노트북에서 인쇄관리 열기</a></span> ‘사진 인쇄’를 누르면 선택한 프린터로 바로 전송됩니다.</p></div><div id="jobs"></div></section><p id="status" role="status" aria-live="polite"></p><footer>사진은 접수 후 24시간 보관됩니다. 인터넷 연결과 이 노트북의 인쇄 도우미 실행이 필요합니다.</footer></main><div id="print-sheet" aria-hidden="true"></div></body></html>
